plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    compileSdk 37

    defaultConfig {
        applicationId "com.walid.ayatalkorsi"
        minSdkVersion 24
        targetSdkVersion 37
        versionCode 14
        versionName "3.0"
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES']
        }
    }


    buildTypes {
        release {
            lintOptions {
                checkReleaseBuilds false
                abortOnError false
            }

            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    namespace 'com.walid.ayatalkorsi'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'com.google.firebase:firebase-messaging:26.0.0'
    implementation 'org.jetbrains:annotations:26.1.0'
    implementation 'com.google.firebase:firebase-analytics:24.0.0'
    implementation "com.github.romandanylyk:PageIndicatorView:v1.0.1"
    implementation 'com.github.naseemali925:ShapedNavigationView:1.0.0'
    implementation 'com.airbnb.android:lottie:6.7.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.work:work-runtime:2.12.0'
    implementation 'com.github.ybq:Android-SpinKit:1.4.0'
    implementation 'com.github.guy-4444:SmartRateUsDialog-Android:1.00.08'
}